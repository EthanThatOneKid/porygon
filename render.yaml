services:
  - type: web
    name: porygon
    runtime: image
    image:
      url: # Set after first Docker build, or use Render's "Deploy from Dockerfile"
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: LETTA_API_KEY
        sync: false
      - key: LETTA_AGENT_ID
        sync: false
      - key: LETTA_BASE_URL
        value: https://api.letta.com
