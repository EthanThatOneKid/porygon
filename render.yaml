services:
  - type: web
    name: porygon
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      # Required
      - key: DISCORD_TOKEN
        sync: false
      - key: LETTA_API_KEY
        sync: false
      - key: LETTA_AGENT_ID
        sync: false

      # Message batching (reduces API calls in active channels)
      - key: MESSAGE_BATCH_ENABLED
        value: "true"
      - key: MESSAGE_BATCH_SIZE
        value: "10"
      - key: MESSAGE_BATCH_TIMEOUT_MS
        value: "30000"

      # Thread support (organized discussions)
      - key: REPLY_IN_THREADS
        value: "true"
      - key: ENABLE_THREAD_CONVERSATIONS
        value: "true"

      # Cloud Sandbox Configuration
      - key: SANDBOX_TTL_MINUTES
        value: "5"
      - key: SANDBOX_REFRESH_INTERVAL_MS
        value: "240000"

      # Tool Approval (Human-in-the-Loop)
      - key: ENABLE_TOOL_APPROVAL
        value: "false"
      - key: TOOL_APPROVAL_TIMEOUT_MS
        value: "60000"

      # Session Isolation
      - key: SESSION_ISOLATION
        value: "channel"

      # Image Handling
      - key: ENABLE_IMAGE_HANDLING
        value: "false"

      # Timer/Heartbeat
      - key: ENABLE_TIMER
        value: "false"
