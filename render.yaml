services:
  - type: web
    name: porygon
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      # Required
      - key: DISCORD_TOKEN
        sync: false
      - key: LETTA_API_KEY
        sync: false
      - key: LETTA_AGENT_ID
        # Free tier: use Blank agent (no tool claims in system prompt)
        # Pro/API: switch back to original Porygon agent for cloud sandbox tools
        value: "agent-73c98a83-9c1d-4d85-8856-93b0932b2e10"

      # Message batching (reduces API calls in active channels)
      - key: MESSAGE_BATCH_ENABLED
        value: "true"
      - key: MESSAGE_BATCH_SIZE
        value: "10"
      - key: MESSAGE_BATCH_TIMEOUT_MS
        value: "30000"

      # Thread support (organized discussions)
      - key: REPLY_IN_THREADS
        value: "true"
      - key: ENABLE_THREAD_CONVERSATIONS
        value: "true"

      # Image Handling
      - key: ENABLE_IMAGE_HANDLING
        value: "false"

      # Timer/Heartbeat
      - key: ENABLE_TIMER
        value: "false"
